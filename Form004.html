<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
</head>
<body>
    <div>
        Tour Management System

        <ul>
            <li>Dashboard</li>
            <li>Search Tours</li>
            <li>My Bookings</li>
            <li>Reviews</li>
        </ul>
        <input type="button" value="Profile">
    </div>

    <div class="header">
        <h4>Overview</h4>
        <h3>Agency Manager Dashboard</h3>
        <h4>Welcome, Manager</h4>
    </div>

    <div>
        <table border="2">
            <tr>
                <td>Packages</td>
                <td>Bookings</td>
                <td>Pending</td>
                <td>Guides</td>
            </tr>
        </table>

        <br>

        <fieldset>
            <legend>Latest Activity</legend>
            <p>Recent Bookings</p>
            <table border="1">
                <tr>
                    <td>Customer</td>
                    <td>Package/td>
                    <td>Date</td>
                    <td>Amount</td>
                    <td>Status</td>
                </tr>
            </table>
        </fieldset>

        <br>

        <input type="button" value="Add New Package">
        <input type="button" value="Assign Tour Guide">
        <input type="button" value="View Reports">
    </div>
</body>
</html>
