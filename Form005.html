<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Guide Dashboard</title>
</head>
<body>
    <div>
        Tour Management System

        <ul>
            <li>Dashboard</li>
            <li>Search Tours</li>
            <li>My Bookings</li>
            <li>Reviews</li>
        </ul>
        <input type="button" value="Profile">
    </div>

    <div class="header">
        <h4>Overview</h4>
        <h3>Agency Manager Dashboard</h3>
        <h4>Welcome, Guide</h4>
    </div>

    <div>
       <fieldset>
        <legend>Upcoming Works</legend>
        <h5>My Assigned Schedules</h5>
        <table border="1">
            <tr>
                <td>Package</td>
                <td>Date</td>
                <td>Tourist</td>
                <td>Status</td>
            </tr>
        </table>
       </fieldset>

       <fieldset>
        <legend>Manage Trip</legend>
        <label for="sel_p">Select Package</label>
        <select name="sel_p" id="sel_p">
            <option value="1">1</option>
        </select>
        <label for="sel_sta">Current Status</label>
        <select name="sel_sta" id="sel_sta">
            <option value="1">1</option>
        </select>
        <input type="button" value="Update Status">
       </fieldset>

       <fieldset>
        <legend>Important Information</legend>
        <h5>Guidelines</h5>
        <table border="1">
            <tr>
                <td>NOTES</td>
                <td>DATE</td>
            </tr>
        </table>
       </fieldset>
    </div>
</body>
</html>
