<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <table>
        <tr>
            <td>
                <fieldset>
                    <p>EXPLORE WITHOUT LIMITS</p>
                    <h1>Your journey<br>starts here</h1>
                    <p>Discover remarkable places and create memories that last a lifetime.</p>
                    <p>Trusted travel, thoughtfully managed.</p>
                </fieldset>
            </td>
            <td>
                <form method="post" novalidate>
                    <fieldset>
                        <p>Welcome To Tour Management System</p>
                        <h1>REGISTRATION</h1>
                        <p>Create your account to get started.</p>
                        <label for="first_name">First Name</label><br>
                        <input type="text" id="first_name" name="first_name" placeholder="First Name"><br>
                        <label for="last_name">Last Name</label><br>
                        <input type="text" id="last_name" name="last_name" placeholder="Last Name"><br>
                        <label for="user_mail">Email</label><br>
                        <input type="email" id="user_mail" name="user_mail" placeholder="Email"><br>
                        <label for="user_password">Password</label><br>
                        <input type="password" id="user_password" name="user_password" placeholder="Enter Password"><br>
                        <label for="confirm_password">Password</label><br>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password"><br>
                        <label for="role">Role</label>
                        <select name="role" id="role">
                            <option value="Staff">Staff</option>
                            <option value="Traveler">Traveler</option>
                        </select>
                        <br>
                        <input type="submit" value="Register">
                        <p>Already have an account?</p>
                        <a href="" >Login Here</a>
                    </fieldset>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
